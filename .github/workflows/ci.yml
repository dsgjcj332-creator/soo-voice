name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: POS adapter registry tests
        run: npm run test:pos
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build

  pos-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: soo_voice_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soo_voice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: soo_voice_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap isolated Supabase auth roles
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/pos-migrations-bootstrap.sql
      - name: Apply POS migrations in dependency order
        run: |
          psql -X -v ON_ERROR_STOP=1 -f sql/2026_11_18_multi_pos_registry.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/2026_11_21_pos_catalog_storage.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/2026_11_22_pos_catalog_menu_mapping.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/2026_11_23_pos_catalog_menu_apply.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/2026_11_24_pos_webhook_ingress.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/2026_11_25_guest_order_rate_limits.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/2026_11_26_billing_foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/2026_11_27_merchant_daily_tasks.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/store_settings.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/2026_11_28_store_settings_profile_fields.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/2026_11_29_platform_admin_audit.sql
      - name: Test store settings save and tenant isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/store-settings-migrations-integration.sql
      - name: Verify schema, RLS and grants
        run: psql -X -v ON_ERROR_STOP=1 -f sql/verify_pos_catalog_staging.sql
      - name: Test catalog sync, audit trigger and tenant isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/pos-migrations-integration.sql
      - name: Test billing foundation RLS and invariants
        run: psql -X -v ON_ERROR_STOP=1 -f tests/billing-migrations-integration.sql
      - name: Test merchant daily task RLS and persistence
        run: psql -X -v ON_ERROR_STOP=1 -f tests/daily-tasks-migrations-integration.sql
      - name: Test platform admin audit immutability and access
        run: psql -X -v ON_ERROR_STOP=1 -f tests/platform-admin-audit-integration.sql
